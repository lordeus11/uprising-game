<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LifeOS Dashboard</title>

<style>
:root{
  --bg:#0f1115;
  --card:#151925;
  --text:#e6e6e6;
  --muted:#9aa4b2;
  --accent:#7c5cff;
  --glass:rgba(255,255,255,0.05);
}

body.light{
  --bg:#f5f6fa;
  --card:#ffffff;
  --text:#1a1d29;
  --muted:#5b6270;
  --glass:rgba(0,0,0,0.05);
}

*{margin:0;padding:0;box-sizing:border-box;font-family:Inter, sans-serif;}
body{background:var(--bg);color:var(--text);transition:.3s;overflow-x:hidden;}

#login{
  height:100vh;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#7c5cff,#00d4ff);
}
.login-box{
  background:rgba(0,0,0,0.3);
  padding:40px;border-radius:20px;
  backdrop-filter:blur(10px);
  text-align:center;
}
input,button{
  padding:10px;border-radius:10px;border:none;margin-top:10px;
}
button{cursor:pointer;background:var(--accent);color:white;}

#app{display:none;height:100vh;}

.sidebar{
  width:250px;background:var(--card);
  position:fixed;height:100%;padding:20px;
  display:flex;flex-direction:column;gap:10px;
}

.sidebar h2{margin-bottom:20px;}
.nav button{
  width:100%;padding:12px;margin:5px 0;
  background:var(--glass);color:var(--text);
  border:none;border-radius:10px;
  cursor:pointer;transition:.2s;
}
.nav button:hover{transform:translateX(5px);background:var(--accent);}

.main{
  margin-left:260px;padding:20px;
}

.page{display:none;animation:fade .3s ease;}
.page.active{display:block;}

.card{
  background:var(--card);
  padding:15px;border-radius:15px;
  margin:10px 0;
  backdrop-filter:blur(10px);
}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;}

input,textarea{
  width:100%;
  background:var(--glass);
  color:var(--text);
}

@keyframes fade{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

.topbar{
  display:flex;justify-content:space-between;align-items:center;
  margin-bottom:20px;
}

.small{color:var(--muted);font-size:12px;}

</style>
</head>

<body>

<!-- LOGIN -->
<div id="login">
  <div class="login-box">
    <h2>LifeOS Login</h2>
    <input id="pass" type="password" placeholder="Şifre gir">
    <br>
    <button onclick="login()">Giriş</button>
  </div>
</div>

<!-- APP -->
<div id="app">

  <div class="sidebar">
    <h2>⚡ LifeOS</h2>
    <div class="nav">
      <button onclick="show('dashboard')">Dashboard</button>
      <button onclick="show('diary')">Günlük</button>
      <button onclick="show('goals')">Hedefler</button>
      <button onclick="show('stock')">Stok</button>
      <button onclick="show('youtube')">YouTube</button>
      <button onclick="show('games')">Oyun</button>
      <button onclick="show('projects')">Projeler</button>
      <button onclick="show('settings')">Ayarlar</button>
    </div>
  </div>

  <div class="main">

    <!-- DASHBOARD -->
    <div id="dashboard" class="page active">
      <div class="topbar">
        <h2>Dashboard</h2>
        <span class="small">Bugün: <span id="date"></span></span>
      </div>
      <div class="grid">
        <div class="card">🔥 Görev özeti</div>
        <div class="card">📊 İstatistik</div>
        <div class="card">💡 Motivasyon: “Devam et.”</div>
      </div>
    </div>

    <!-- DIARY -->
    <div id="diary" class="page">
      <h2>Günlük</h2>
      <textarea id="diaryText" placeholder="Bugünü yaz..."></textarea>
      <button onclick="saveDiary()">Kaydet</button>
      <div id="diaryList"></div>
    </div>

    <!-- GOALS -->
    <div id="goals" class="page">
      <h2>Hedefler</h2>
      <input id="goalInput" placeholder="Hedef ekle">
      <button onclick="addGoal()">Ekle</button>
      <div id="goalList"></div>
    </div>

    <!-- STOCK -->
    <div id="stock" class="page">
      <h2>Stok</h2>
      <input id="itemName" placeholder="Ürün">
      <input id="itemQty" placeholder="Adet">
      <button onclick="addItem()">Ekle</button>
      <div id="stockList"></div>
    </div>

    <!-- YOUTUBE -->
    <div id="youtube" class="page">
      <h2>YouTube</h2>
      <input id="yt" placeholder="Video URL">
      <button onclick="addVideo()">Ekle</button>
      <div id="videoList"></div>
    </div>

    <!-- GAMES -->
    <div id="games" class="page">
      <h2>Oyun Alanı</h2>
      <div class="card">🎮 Mini oyun placeholder</div>
    </div>

    <!-- PROJECTS -->
    <div id="projects" class="page">
      <h2>Projeler</h2>
      <input id="project" placeholder="Proje">
      <button onclick="addProject()">Ekle</button>
      <div id="projectList"></div>
    </div>

    <!-- SETTINGS -->
    <div id="settings" class="page">
      <h2>Ayarlar</h2>
      <button onclick="toggleTheme()">🌙 Dark/Light</button>
      <button onclick="resetAll()">🗑 Sıfırla</button>
    </div>

  </div>
</div>

<script>
let data = {
  diary: JSON.parse(localStorage.getItem("diary")||"[]"),
  goals: JSON.parse(localStorage.getItem("goals")||"[]"),
  stock: JSON.parse(localStorage.getItem("stock")||"[]"),
  videos: JSON.parse(localStorage.getItem("videos")||"[]"),
  projects: JSON.parse(localStorage.getItem("projects")||"[]")
};

function login(){
  if(document.getElementById("pass").value==="1234"){
    document.getElementById("login").style.display="none";
    document.getElementById("app").style.display="block";
    load();
  }
}

function show(id){
  document.querySelectorAll(".page").forEach(p=>p.classList.remove("active"));
  document.getElementById(id).classList.add("active");
}

function save(){
  localStorage.setItem("diary",JSON.stringify(data.diary));
  localStorage.setItem("goals",JSON.stringify(data.goals));
  localStorage.setItem("stock",JSON.stringify(data.stock));
  localStorage.setItem("videos",JSON.stringify(data.videos));
  localStorage.setItem("projects",JSON.stringify(data.projects));
}

/* DIARY */
function saveDiary(){
  data.diary.push(document.getElementById("diaryText").value);
  save();load();
}

/* GOALS */
function addGoal(){
  data.goals.push(document.getElementById("goalInput").value);
  save();load();
}

/* STOCK */
function addItem(){
  data.stock.push({
    name:document.getElementById("itemName").value,
    qty:document.getElementById("itemQty").value
  });
  save();load();
}

/* YT */
function addVideo(){
  data.videos.push(document.getElementById("yt").value);
  save();load();
}

/* PROJECT */
function addProject(){
  data.projects.push(document.getElementById("project").value);
  save();load();
}

/* THEME */
function toggleTheme(){
  document.body.classList.toggle("light");
}

/* RESET */
function resetAll(){
  localStorage.clear();
  location.reload();
}

/* LOAD */
function load(){
  document.getElementById("date").innerText=new Date().toLocaleDateString();

  document.getElementById("goalList").innerHTML=
    data.goals.map(g=>`<div class='card'>🎯 ${g}</div>`).join("");

  document.getElementById("stockList").innerHTML=
    data.stock.map(s=>`<div class='card'>📦 ${s.name} - ${s.qty}</div>`).join("");

  document.getElementById("diaryList").innerHTML=
    data.diary.map(d=>`<div class='card'>📒 ${d}</div>`).join("");

  document.getElementById("videoList").innerHTML=
    data.videos.map(v=>`<div class='card'><iframe width='100%' src='${v.replace("watch?v=","embed/")}'></iframe></div>`).join("");

  document.getElementById("projectList").innerHTML=
    data.projects.map(p=>`<div class='card'>🗂 ${p}</div>`).join("");
}

</script>

</body>
</html>
